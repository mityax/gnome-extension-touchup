
from: base


steps:
  # Double tap desktop background:
  - touch: 50% 50%
  - touch: 50% 50%
  - wait:
      for:
        dominant_color: black
  
  # Wake up again:
  #- touch: 50% 50%
  #- wait:
  #    for:
  #      dominant_color: "#002d8e"  # desktop background blue, darkened by the Shell's screen shield
  
  # Unlock:
  - type_text: $VM_USER_PASSWORD  # typing the password also wakes up the machine
    speed: slow
  - sleep: 1s
  - invoke_key: ret
  - wait:
      for: desktop

  # Double tap top panel:
  - touch: 62% 5px
  - touch: 62% 5px
  - wait:
      for:
        dominant_color: black

  # Wake up again:
  - touch: 50% 50%
  
  # Double tap lockscreen:
  - touch: 50% 50%
  - touch: 50% 50%
  - wait:
      for:
        dominant_color: black

